<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d4f">
  <title>NutriTrack</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">🌱</span> NutriTrack</div>
    <nav class="nav" aria-label="Main">
      <button data-nav="today">Today</button>
      <button data-nav="foods">Foods</button>
      <button data-nav="supps">Supplements</button>
      <button data-nav="profile">Profile</button>
    </nav>
  </header>
  <main id="main" class="container"></main>
  <div id="modal"></div>
  <div id="banner" role="status" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
