[project]
name = "nutritrack"
version = "2.2.0"
description = "Calories, macros, micronutrients, water and supplements, with reminders and a garden that grows with your consistency."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flet==1.1.2",
  "flet-notifications==1.1.2",
  "flet-charts==1.1.2",
  "flet-camera==1.1.2",
  "zxing-cpp>=2.2",
  "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "flet[web]==1.1.2", "python-barcode>=0.15"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.flet]
org = "app.nutritrack"
product = "NutriTrack"
company = "NutriTrack"
copyright = "NutriTrack"

[tool.flet.app]
path = "src"

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
"android.permission.CAMERA" = true
"android.permission.INTERNET" = true

[tool.flet.ios.info]
NSCameraUsageDescription = "NutriTrack uses the camera to scan food barcodes."

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E9/F: syntax errors, undefined names, unused imports. B: common bug patterns (mutable defaults,
# loop-variable capture in lambdas, assert False, ...). PLE: runtime errors pylint can spot statically.
select = ["E9", "F", "B", "PLE"]
ignore = [
  "B008",   # calling ft.Animation(...) etc. in defaults is intentional and immutable
]
